plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**'
}
neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = file("run/${name}")
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}
configurations { runtimeClasspath.extendsFrom localRuntime }
tasks.withType(ProcessResources).configureEach {
    var properties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                      neo_version: neo_version, mod_id: mod_id, mod_name: mod_name,
                      mod_license: mod_license, mod_version: mod_version]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
publishing {
    publications { register('mavenJava', MavenPublication) { from components.java } }
    repositories { maven { url = layout.projectDirectory.dir('repo') } }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
idea { module { downloadSources = true; downloadJavadoc = true } }

// Forward console commands to the dedicated development server.
tasks.named('runServer', JavaExec).configure { standardInput = System.in }
